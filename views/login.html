<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Share Hubs Engineering</title>
  <meta name="description" content="Access your Share Hubs Engineering account to request quotes and track projects." />
  <link rel="icon" href="/assets/img/resized_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/design-system.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 30% 15%, #1b0406 0%, #0a0a0a 55%, #000 100%);
      color: var(--text-100); padding: 24px;
    }
    .auth-shell { width: 440px; max-width: 100%; }
    .auth-head { text-align: center; margin-bottom: 26px; }
    .auth-head img { width: 64px; margin-bottom: 16px; }
    .auth-head h1 { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
    .auth-head p { color: var(--text-500); font-size: 14px; margin-top: 6px; }
    .auth-card { padding: 34px 32px; }
    .auth-tabs { display: flex; background: var(--ink-800); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 26px; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600; color: var(--text-500);
      background: none; border: none; border-radius: 7px; cursor: pointer; transition: all var(--t-fast); }
    .auth-tab.active { background: var(--red-500); color: #fff; }
    .auth-pane { display: none; }
    .auth-pane.active { display: block; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap > .bx { position: absolute; right: 15px; color: var(--text-500); font-size: 18px; pointer-events: none; }
    .toggle-password { position: absolute; right: 10px; background: none; border: none; color: var(--text-500);
      font-size: 18px; cursor: pointer; padding: 6px; border-radius: 6px; display: flex; }
    .toggle-password:hover { color: var(--text-100); }
    .toggle-password .bx { position: static; }
    .row-between { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 18px; font-size: 13px; }
    .remember { display: flex; align-items: center; gap: 7px; color: var(--text-300); cursor: pointer; }
    .remember input { accent-color: var(--red-500); }
    .text-link { color: var(--red-400); text-decoration: none; }
    .text-link:hover { text-decoration: underline; }
    .btn-full { width: 100%; height: 48px; position: relative; }
    .btn-full.is-loading .label { visibility: hidden; }
    .btn-full .sh-spinner { display: none; position: absolute; }
    .btn-full.is-loading .sh-spinner { display: block; }
    .back-home { display: inline-flex; align-items: center; gap: 6px; color: var(--text-500); text-decoration: none;
      font-size: 13px; margin-top: 20px; justify-content: center; width: 100%; }
    .back-home:hover { color: var(--text-100); }
  </style>
</head>
<body class="sh">
  <div class="auth-shell">
    <div class="auth-head">
      <img src="/assets/img/resized_logo.png" alt="Share Hubs Engineering" />
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSub">Sign in to request quotes and track your projects.</p>
    </div>

    <div class="sh-card auth-card">
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Sign in</button>
        <button class="auth-tab" id="tabRegister" role="tab" aria-selected="false">Create account</button>
      </div>

      <form class="auth-pane active" id="loginForm" novalidate>
        <div class="sh-field">
          <label for="loginEmail">Email</label>
          <div class="input-wrap">
            <input class="sh-input" type="email" id="loginEmail" autocomplete="email" placeholder="you@company.com" required />
            <i class="bx bx-envelope"></i>
          </div>
          <small class="sh-field-error" id="loginEmailError"></small>
        </div>
        <div class="sh-field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <input class="sh-input" type="password" id="loginPassword" autocomplete="current-password" placeholder="Your password" required />
            <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Show password"><i class="bx bx-show"></i></button>
          </div>
          <small class="sh-field-error" id="loginPasswordError"></small>
        </div>
        <div class="row-between">
          <label class="remember"><input type="checkbox" id="remember" /> Remember me</label>
          <a class="text-link" href="#" id="forgotLink">Forgot password?</a>
        </div>
        <button type="submit" class="sh-btn sh-btn--primary btn-full" id="loginBtn">
          <span class="label">Sign in</span><span class="sh-spinner"></span>
        </button>
      </form>

      <form class="auth-pane" id="registerForm" novalidate>
        <div class="sh-field">
          <label for="username">Name</label>
          <div class="input-wrap">
            <input class="sh-input" type="text" id="username" autocomplete="name" placeholder="Your full name" required />
            <i class="bx bx-user"></i>
          </div>
          <small class="sh-field-error" id="usernameError"></small>
        </div>
        <div class="sh-field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input class="sh-input" type="email" id="email" autocomplete="email" placeholder="you@company.com" required />
            <i class="bx bx-envelope"></i>
          </div>
          <small class="sh-field-error" id="emailError"></small>
        </div>
        <div class="sh-field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="sh-input" type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required />
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password"><i class="bx bx-show"></i></button>
          </div>
          <small class="sh-field-error" id="passwordError"></small>
        </div>
        <button type="submit" class="sh-btn sh-btn--primary btn-full" id="registerBtn">
          <span class="label">Create account</span><span class="sh-spinner"></span>
        </button>
      </form>
    </div>

    <a href="/" class="back-home"><i class="bx bx-arrow-back"></i> Back to site</a>
  </div>

  <div class="sh-toast" id="toast"><i class="bx" id="toastIcon"></i><span id="toastMsg"></span></div>

  <script>
    const API = location.origin;
    const $ = s => document.querySelector(s);
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const nextParam = new URLSearchParams(location.search).get('next');

    const tabLogin = $('#tabLogin'), tabReg = $('#tabRegister');
    function setTab(login) {
      tabLogin.classList.toggle('active', login); tabReg.classList.toggle('active', !login);
      tabLogin.setAttribute('aria-selected', login); tabReg.setAttribute('aria-selected', !login);
      $('#loginForm').classList.toggle('active', login); $('#registerForm').classList.toggle('active', !login);
      $('#authTitle').textContent = login ? 'Welcome back' : 'Create your account';
      $('#authSub').textContent = login ? 'Sign in to request quotes and track your projects.' : 'Join to send requests and follow their progress.';
    }
    tabLogin.onclick = () => setTab(true);
    tabReg.onclick = () => setTab(false);

    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.onclick = () => {
        const i = document.getElementById(btn.dataset.target), ic = btn.querySelector('i');
        const show = i.type === 'password'; i.type = show ? 'text' : 'password';
        ic.className = show ? 'bx bx-hide' : 'bx bx-show';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      };
    });

    let tt;
    function toast(msg, ok) {
      $('#toastMsg').textContent = msg;
      $('#toastIcon').className = 'bx ' + (ok ? 'bx-check-circle' : 'bx-error-circle');
      const t = $('#toast'); t.className = 'sh-toast show ' + (ok ? 'sh-toast--ok' : 'sh-toast--err');
      clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 4200);
    }
    function fieldErr(id, eid, msg) {
      document.getElementById(id).closest('.sh-field').classList.toggle('sh-field--invalid', !!msg);
      document.getElementById(eid).textContent = msg || ''; return !msg;
    }
    function loading(btn, on) { btn.classList.toggle('is-loading', on); btn.disabled = on; }

    (() => {
      const v = new URLSearchParams(location.search).get('verified');
      if (v === 'success') toast('Email verified — you can sign in now.', true);
      else if (v === 'expired') toast('That verification link expired. Please register again.', false);
    })();

    $('#registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const u = $('#username').value.trim(), em = $('#email').value.trim(), pw = $('#password').value;
      let ok = true;
      ok = fieldErr('username','usernameError', u.length>=2?'':'Enter at least 2 characters.') && ok;
      ok = fieldErr('email','emailError', emailRe.test(em)?'':'Enter a valid email.') && ok;
      ok = fieldErr('password','passwordError', pw.length>=8?'':'At least 8 characters.') && ok;
      if (!ok) return;
      const btn = $('#registerBtn'); loading(btn, true);
      try {
        const r = await fetch(API+'/auth/register', { method:'POST', headers:{'Content-Type':'application/json'},
          credentials:'include', body: JSON.stringify({username:u, email:em, password:pw}) });
        const d = await r.json();
        if (r.ok) { toast(d.message, true); $('#registerForm').reset(); setTimeout(()=>setTab(true), 1400); }
        else toast(d.error || 'Registration failed.', false);
      } catch { toast('Network error. Please try again.', false); }
      finally { loading(btn, false); }
    });

    $('#loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const em = $('#loginEmail').value.trim(), pw = $('#loginPassword').value;
      let ok = true;
      ok = fieldErr('loginEmail','loginEmailError', emailRe.test(em)?'':'Enter a valid email.') && ok;
      ok = fieldErr('loginPassword','loginPasswordError', pw?'':'Password is required.') && ok;
      if (!ok) return;
      const btn = $('#loginBtn'); loading(btn, true);
      try {
        const r = await fetch(API+'/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
          credentials:'include', body: JSON.stringify({email:em, password:pw}) });
        const d = await r.json();
        if (r.ok) { toast('Signed in. Redirecting…', true); setTimeout(()=> location.href = nextParam || d.redirect || '/', 800); }
        else toast(d.error || 'Login failed.', false);
      } catch { toast('Network error. Please try again.', false); }
      finally { loading(btn, false); }
    });

    $('#forgotLink').addEventListener('click', e => { e.preventDefault(); toast('Password reset is coming soon. Contact your admin for now.', false); });
  </script>
</body>
</html>
