  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% 0%, #1b0406 0%, #0a0a0a 55%, #000 100%);
      color: var(--text-100); overflow-x: hidden;
    }
    .nf-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px; border-bottom: 1px solid var(--ink-800);
    }
    .nf-header img { height: 44px; width: auto; }
    .nf-nav { display: flex; gap: 26px; }
    .nf-nav a { color: var(--text-300); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .18s; }
    .nf-nav a:hover { color: var(--red-400); }
    @media (max-width: 720px) { .nf-nav { display: none; } }

    .nf-main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 60px 24px; position: relative;
    }
    .nf-gear { position: absolute; opacity: 0.05; pointer-events: none; animation: nf-spin 50s linear infinite; }
    .nf-gear.one { top: 12%; right: 10%; font-size: 200px; }
    .nf-gear.two { bottom: 10%; left: 8%; font-size: 150px; animation-direction: reverse; }
    @keyframes nf-spin { to { transform: rotate(360deg); } }

    .nf-code {
      font-family: var(--font-display); font-weight: 800;
      font-size: clamp(96px, 18vw, 200px); line-height: 1; letter-spacing: -.04em;
      background: linear-gradient(135deg, var(--red-400), var(--red-700));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .nf-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 4vw, 30px); margin-bottom: 14px; }
    .nf-sub { max-width: 460px; color: var(--text-300); font-size: 15.5px; line-height: 1.6; margin-bottom: 32px; }
    .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .nf-footer { padding: 20px; text-align: center; color: var(--text-700); font-size: 13px; border-top: 1px solid var(--ink-800); }
    @media (prefers-reduced-motion: reduce) { .nf-gear { animation: none; } }
  </style>
</head>
